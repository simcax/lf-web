<!-- Login Button and Dropdown -->
<div id="loginnavinner" class="relative" x-data="{ loginOpen: false }">
    <!-- Login Trigger Button -->
    <button @click="loginOpen = !loginOpen"
            class="px-3 py-1 bg-green-700 text-white text-sm font-medium rounded-md hover:bg-green-800 focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-2 focus:ring-offset-lime-500">
        Log ind
    </button>

    <!-- Login Form Dropdown -->
    <div x-show="loginOpen"
         @click.outside="loginOpen = false"
         x-transition:enter="transition ease-out duration-100"
         x-transition:enter-start="opacity-0 scale-95"
         x-transition:enter-end="opacity-100 scale-100"
         x-transition:leave="transition ease-in duration-75"
         x-transition:leave-start="opacity-100 scale-100"
         x-transition:leave-end="opacity-0 scale-95"
         class="absolute right-0 mt-2 w-64 origin-top-right bg-white border border-gray-200 rounded-md shadow-lg p-4 z-50"
         x-cloak>
        <form hx-post="/auth/login" hx-target="#loginnav" hx-swap="outerHTML" class="flex flex-col space-y-3">
            <div>
                <label for="username-desktop" class="sr-only">Username</label>
                <input name="username" placeholder="Username" class="w-full px-2 py-1 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-lime-300 focus:border-transparent" id="username-desktop" required>
            </div>
            <div>
                <label for="password-desktop" class="sr-only">Password</label>
                <input type="password" placeholder="Password" class="w-full px-2 py-1 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-lime-300 focus:border-transparent" name="password" id="password-desktop" required aria-describedby="loginErrorDesktop">
            </div>
            <div>
                <button type="submit" class="w-full px-3 py-1 bg-green-700 text-white text-sm font-medium rounded-md hover:bg-green-800 focus:outline-none focus:ring-2 focus:ring-slate-500 focus:ring-offset-2 focus:ring-offset-lime-500">Log ind</button>
            </div>
            {% for message in get_flashed_messages(category_filter=["login_error"]) %}
            <div id="loginErrorDesktop" class="flash text-red-700 text-xs font-semibold">{{ message }}</div>
            {% endfor %}
        </form>
    </div>
</div>

<script>
    (function() {
        // Ensure this listener is added only once
        if (window.hasAddedLogoutReloadListener) return;
        window.hasAddedLogoutReloadListener = true;

        document.body.addEventListener('htmx:afterSwap', function(evt) {
            // Check if the swap happened on the #loginnav element, indicating logout
            if (evt.detail.target.id === 'loginnav') {
                // Use sessionStorage to ensure reload happens only once after logout
                if (!sessionStorage.getItem('reloadedAfterLogout')) {
                        sessionStorage.setItem('reloadedAfterLogout', 'true');
                        // Use a small delay to allow HTMX swap to visually complete
                        setTimeout(() => {
                                 window.location.reload();
                        }, 50);
                }
            }
        });

        // Clean up the flag when the user navigates away or closes the tab/window
        // This allows the reload to happen again on a subsequent logout within the same browser session
        window.addEventListener('beforeunload', () => {
                sessionStorage.removeItem('reloadedAfterLogout');
        });
    })();
</script>
