{% if g.user %}
<div x-data="{ open: false }" class="relative inline-block text-left">
    <div>
        <button @click="open = !open" type="button" class="inline-flex items-center justify-center w-full rounded-md border border-gray-300 shadow-sm px-3 py-1 bg-white text-sm font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-gray-100 focus:ring-indigo-500" id="menu-button" aria-expanded="true" aria-haspopup="true">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-person-fill h-5 w-5 mr-1 text-gray-500" viewBox="0 0 16 16">
                <path d="M3 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6"/>
            </svg>
            {{ g.user.FirstName }} {{ g.user.LastName }}
            <!-- Heroicon name: solid/chevron-down -->
            <svg class="-mr-1 ml-2 h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" />
            </svg>
        </button>
    </div>

    <div x-show="open"
            @click.away="open = false"
            x-transition:enter="transition ease-out duration-100"
            x-transition:enter-start="transform opacity-0 scale-95"
            x-transition:enter-end="transform opacity-100 scale-100"
            x-transition:leave="transition ease-in duration-75"
            x-transition:leave-start="transform opacity-100 scale-100"
            x-transition:leave-end="transform opacity-0 scale-95"
            class="origin-top-right absolute right-0 mt-2 w-56 rounded-md shadow-lg bg-white ring-1 ring-black ring-opacity-5 focus:outline-none z-10"
            role="menu" aria-orientation="vertical" aria-labelledby="menu-button" tabindex="-1">
        <div class="py-1" role="none">
            <!-- Active: "bg-gray-100 text-gray-900", Not Active: "text-gray-700" -->
            <a href="https://3196.foreninglet.dk/memberportal/dashboard" class="text-gray-700 block px-4 py-2 text-sm hover:bg-gray-100" role="menuitem" tabindex="-1" id="menu-item-0">Profile</a>
            <a hx-post="{{ url_for('auth.logout') }}"
                hx-target="#loginnav"
                hx-swap="innerHTML"
                hx-confirm="Are you sure you want to log out?"
                class="text-gray-700 block px-4 py-2 text-sm hover:bg-gray-100 cursor-pointer"
                role="menuitem" tabindex="-1" id="menu-item-1">Logout</a>
            <!-- Add more dropdown items here if needed -->
        </div>
    </div>
</div>

{% endif %}
{% if loggedout %}
    <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative" role="alert">
        <strong class="font-bold">Logget ud!</strong>
        <span class="block sm:inline">Du er nu logget ud.</span>
    </div>
{% endif %}
<script>
    (function() {
        // Ensure this listener is added only once
        if (window.hasAddedLogoutReloadListener) return;
        window.hasAddedLogoutReloadListener = true;

        document.body.addEventListener('htmx:afterSwap', function(evt) {
            // Check if the swap happened on the #loginnav element, indicating logout
            if (evt.detail.target.id === 'loginnav') {
                // Use sessionStorage to ensure reload happens only once after logout
                if (!sessionStorage.getItem('reloadedAfterLogout')) {
                        sessionStorage.setItem('reloadedAfterLogout', 'true');
                        // Use a small delay to allow HTMX swap to visually complete
                        setTimeout(() => {
                                 window.location.reload();
                        }, 50);
                }
            }
        });

        // Clean up the flag when the user navigates away or closes the tab/window
        // This allows the reload to happen again on a subsequent logout within the same browser session
        window.addEventListener('beforeunload', () => {
                sessionStorage.removeItem('reloadedAfterLogout');
        });
    })();
</script>
