<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Navigation Link</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div class="container mx-auto mt-10 max-w-lg p-6 bg-white rounded-lg shadow-md">
        <h1 class="text-2xl font-bold mb-6 text-gray-800">Add New Navigation Link</h1>
        <form action="/pages/add-link" method="post">
            <div class="mb-4">
                <label for="title" class="block text-sm font-medium text-gray-700 mb-1">Title</label>
                <input type="text" id="title" name="title" required
                       class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
            </div>

            <div class="mb-4">
                <label for="url" class="block text-sm font-medium text-gray-700 mb-1">URL</label>
                <input type="text" id="url" name="url" required
                       class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
                       placeholder="e.g., /pages/about-us">
            </div>

            <div class="mb-4">
                <label for="md" class="block text-sm font-medium text-gray-700 mb-1">Markdown File</label>
                <input type="text" id="md" name="md" required
                       class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
                       placeholder="e.g., about_us.md">
            </div>

            <div class="mb-6">
                <div class="flex items-center">
                    <input id="subpages" name="subpages" type="checkbox" value="true"
                           class="h-4 w-4 text-indigo-600 focus:ring-indigo-500 border-gray-300 rounded">
                    <label for="subpages" class="ml-2 block text-sm text-gray-900">
                        Has Subpages?
                    </label>
                </div>
                 <input type="hidden" name="subpages" value="false"> <!-- Sends 'false' if checkbox is unchecked -->
            </div>


            <div>
                <button type="submit"
                        class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                    Save Link
                </button>
            </div>
        </form>
         <script>
            // Ensure the hidden input value is overridden by the checkbox if checked
            const checkbox = document.getElementById('subpages');
            const hiddenInput = document.querySelector('input[type="hidden"][name="subpages"]');
            checkbox.addEventListener('change', function() {
                hiddenInput.disabled = this.checked;
            });
             // Initialize disabled state based on initial checked status
            hiddenInput.disabled = checkbox.checked;
        </script>
    </div>
</body>
</html>
