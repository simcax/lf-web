<style>

  .container {

  }

  }

<body>
  {% block content %}{% endblock content %}
  <!-- Include SimpleMDE JavaScript -->
  <script src="https://cdn.jsdelivr.net/simplemde/latest/simplemde.min.js"></script>
    
  <script>
      document.addEventListener('DOMContentLoaded', function() {
          // Initialize SimpleMDE
          var simplemde = new SimpleMDE({
              element: document.getElementById("markdown-editor"),
              spellChecker: true,
              autosave: {
                  enabled: true,
                  unique_id: "markdown_editor"
              },
              toolbar: [
                  "bold", "italic", "heading", "|", 
                  "quote", "unordered-list", "ordered-list", "|",
                  "link", "image", "table", "|",
                  "preview", "side-by-side", "fullscreen", "|",
                  "guide"
              ]
          });
          
          // Update preview on change
          simplemde.codemirror.on("change", function() {
              document.getElementById("preview-content").innerHTML = simplemde.markdown(simplemde.value());
          });
          
          // Initial preview render
          document.getElementById("preview-content").innerHTML = simplemde.markdown(simplemde.value());
          
          // Handle form submission
          document.getElementById("editor-form").addEventListener("submit", function(e) {
              // You can add form validation or AJAX submission here
              const content = simplemde.value();
              // Uncomment and modify the next line for AJAX submission
              // e.preventDefault(); // Prevent default form submission
              // submitContent(content);
          });
      });

          console.log("Submitting content:", content);
      }
  </script>
